[project]
name = "bluecore-client"
version = "0.2.0"
description = "Python client and command line interface for the Blue Core API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ed Summers", email = "ehs@pobox.com" }]
keywords = ["bibframe", "rdf", "linked-data", "json-ld", "libraries", "marc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "typer>=0.15.4",
  "rich>=13.0",
  "python-dotenv>=1.1.0",
  # For turtle / RDF-XML / N-Triples output of search and list results, which
  # the API only serves as JSON-LD.
  "rdflib>=7.1.3",
]

[project.urls]
Homepage = "https://github.com/blue-core-lod/bluecore-client"
Repository = "https://github.com/blue-core-lod/bluecore-client"
Issues = "https://github.com/blue-core-lod/bluecore-client/issues"
"Blue Core API" = "https://github.com/blue-core-lod/bluecore_api"

[project.scripts]
bluecore = "bluecore_client.cli.app:app"

[dependency-groups]
dev = [
  "ruff>=0.11.6",
  "pytest>=8.3.4",
  "pytest-httpx>=0.35.0",
  # Declared so CI resolves the same checker as a local `uv run ty check`,
  # rather than whatever happens to be on PATH.
  "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluecore_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a live API, so they're out of the default run.
# `pytest -m integration` overrides this.
addopts = "-m 'not integration'"
filterwarnings = [
  # rdflib's own JSON-LD parser uses a deprecated class internally.
  "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
]
markers = [
  "integration: talks to a running Blue Core API (deselect with '-m \"not integration\"')",
]

[tool.ruff.lint]
extend-select = ["I"]
